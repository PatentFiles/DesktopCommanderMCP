name: Desktop Terminal Sync Windows build
on:
  push:
    branches: [desktop-terminal-sync]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply deterministic product branding
        run: node scripts/dts/rebrand.mjs --verbose
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile MCP server
        run: npm run build
      - name: Verify MCP handshake and tools
        run: node scripts/dts/smoke.mjs
        env:
          DESKTOP_TERMINAL_SYNC_DISABLE_TELEMETRY: '1'
      - name: Record rebranded source in dedicated branch
        shell: pwsh
        run: |
          git config user.name 'Desktop Terminal Sync CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ((git diff --cached --name-only).Length -gt 0) {
            git commit -m 'Apply Desktop Terminal Sync branding'
            git push origin HEAD:desktop-terminal-sync
          }
      - name: Package rebranded source
        shell: pwsh
        run: |
          git archive --format=zip --output="$env:RUNNER_TEMP\Desktop-Terminal-Sync-Source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
      - name: Upload tested source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-Terminal-Sync-Windows
          path: ${{ runner.temp }}\Desktop-Terminal-Sync-Source.zip
          retention-days: 30
